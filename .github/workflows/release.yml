name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build archive
        run: |
          xcodebuild archive \
            -project Claudio.xcodeproj \
            -scheme Claudio \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/Claudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Claudio.xcarchive/Products/Applications/Claudio.app"
          ZIP="build/Claudio-${VERSION}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP"           >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"   >> "$GITHUB_ENV"
          shasum -a 256 "$ZIP" | tee "build/Claudio-${VERSION}.sha256"
          echo "SHA256=build/Claudio-${VERSION}.sha256" >> "$GITHUB_ENV"

      - name: Install Sparkle tools
        run: |
          curl -L https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle

      - name: Sign update and update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ env.VERSION }}"
          ZIP="${{ env.ZIP }}"
          DOWNLOAD_URL="https://github.com/miloguastamacchia-source/claudio/releases/download/v${VERSION}/Claudio-${VERSION}.zip"

          # Write private key to a temp file (sign_update can't read /dev/stdin on macOS)
          KEY_FILE=$(mktemp)
          echo "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Sign the zip
          SIGNATURE=$(/tmp/sparkle/bin/sign_update "$ZIP" --ed-key-file "$KEY_FILE")
          rm -f "$KEY_FILE"
          FILESIZE=$(stat -f%z "$ZIP")

          # Write the new appcast.xml with all entries
          cat > appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>Claudio</title>
                  <link>https://github.com/miloguastamacchia-source/claudio</link>
                  <description>Claudio update feed</description>
                  <language>en</language>
                  <item>
                      <title>Claudio ${VERSION}</title>
                      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                      <sparkle:version>${VERSION}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                      <enclosure
                          url="${DOWNLOAD_URL}"
                          sparkle:edSignature="${SIGNATURE}"
                          length="${FILESIZE}"
                          type="application/octet-stream"
                      />
                  </item>
              </channel>
          </rss>
          APPCAST

      - name: Commit appcast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for v${{ env.VERSION }}"
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Claudio ${{ env.VERSION }}"
          body: |
            ## Install

            1. Download `Claudio-${{ env.VERSION }}.zip` below
            2. Unzip and drag **Claudio.app** to your Applications folder
            3. Right-click → Open the first time (unsigned build — Gatekeeper will ask once)

            Requires macOS 13 (Ventura) or later.

            Once installed, Claudio checks for updates automatically. You can also trigger a check via **Menu → Check for Updates…**
          files: |
            ${{ env.ZIP }}
            ${{ env.SHA256 }}
